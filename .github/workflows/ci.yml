name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  lint:
    name: Lint (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'examples/postgresstore']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache: false
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          working-directory: ${{ matrix.module }}

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l quota internal examples)"
      - run: go vet ./...
      - run: make test
      - run: go test ./quota -run '^$' -fuzz FuzzAccounting -fuzztime=10s
      - run: go test ./quota -run '^$' -fuzz FuzzConsume -fuzztime=10s
      - run: go run ./examples/reservation

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: examples/postgresstore/go.mod
          cache-dependency-path: examples/postgresstore/go.sum
      - run: make postgres-up
      - run: make integration
      - name: PostgreSQL logs
        if: failure()
        run: docker compose logs postgres
      - name: Stop PostgreSQL
        if: always()
        run: make postgres-down

  vulnerability:
    name: Vulnerability scan (${{ matrix.module }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: ['.', 'examples/postgresstore']
    steps:
      - uses: golang/govulncheck-action@v1
        with:
          go-version-input: '1.26.x'
          work-dir: ${{ matrix.module }}
          cache: false
