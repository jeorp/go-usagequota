name: Go

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Formatting
        run: test -z "$(gofmt -l quota internal examples)"
      - run: go vet ./...
      - run: go test -race ./...
      - run: go test ./quota -run '^$' -fuzz FuzzAccounting -fuzztime=10s
      - run: go test ./quota -run '^$' -fuzz FuzzConsume -fuzztime=10s
      - run: go run ./examples/reservation

  postgres:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache-dependency-path: examples/postgresstore/go.sum
      - run: make postgres-up
      - run: make integration
      - name: PostgreSQL logs
        if: failure()
        run: docker compose logs postgres
      - name: Stop PostgreSQL
        if: always()
        run: make postgres-down
