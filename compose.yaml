name: go-usagequota

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: quota
      POSTGRES_USER: quota
      POSTGRES_PASSWORD: quota
    ports:
      - "127.0.0.1:${QUOTA_POSTGRES_PORT:-55432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quota -d quota"]
      interval: 2s
      timeout: 2s
      retries: 30
